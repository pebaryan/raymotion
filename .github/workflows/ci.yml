name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    # Full suite: raylib 6.2 from source, GL tests on Mesa llvmpipe under Xvfb.
    # Non-blocking for now: Windows is the supported platform.
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 ffmpeg xvfb \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build --output-on-failure

  windows:
    # Hosted Windows runners have no OpenGL 3.3 driver: build everything, run non-GL tests.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        raylib: [vendored, fetch]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DRAYMOTION_RAYLIB=${{ matrix.raylib }}
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release -LE gl --output-on-failure

  macos:
    # Portability build; GL tests need a display session, so only non-GL tests run.
    # Non-blocking for now: Windows is the supported platform.
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build -LE gl --output-on-failure
